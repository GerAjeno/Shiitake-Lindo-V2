# Sin esto, el driver de logs por defecto de Docker (json-file) no rota ni limita tamaño — la
# contraseña admin autogenerada que el backend imprime una sola vez al arrancar (ver
# auth/bootstrap.ts) quedaría legible en `docker compose logs` indefinidamente, meses después de
# que ya se cambió.
x-logging: &logging-por-defecto
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    <<: *logging-por-defecto
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Solo accesible desde la propia VM (loopback) — necesario para correr los scripts de
      # Backend/scripts/*.js directo en el servidor (provisionar dispositivo, generar clave OTA,
      # migrar datos). No queda expuesto a internet ni a la red local.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    <<: *logging-por-defecto
    build:
      context: ..
      dockerfile: Backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD}
      OTA_SIGNING_PRIVATE_KEY_PATH: ${OTA_SIGNING_PRIVATE_KEY_PATH}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      PORT: 3001
    volumes:
      # Solo el archivo que el backend realmente necesita — NO toda la carpeta ./secrets/, que
      # también puede contener el service account de Firebase (uso único, ver
      # scripts/migrar-datos-firebase.js) u otros archivos administrativos que no deberían quedar
      # accesibles a este contenedor de larga duración.
      - ./secrets/ota-signing-key.pem:/run/secrets/ota-signing-key.pem:ro
      - firmware_data:/data/firmware
    # Antes solo postgres tenía healthcheck: Caddy podía seguir mandando tráfico a un backend
    # "arriba pero colgado" (proceso vivo, pero sin responder) sin que Docker se enterara ni lo
    # reiniciara — `restart: unless-stopped` no ayuda si el proceso nunca llega a morir solo.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3001/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    <<: *logging-por-defecto
    build:
      context: ..
      dockerfile: Frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  caddy:
    <<: *logging-por-defecto
    image: caddy:2-alpine
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

  cloudflared:
    <<: *logging-por-defecto
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - caddy

volumes:
  postgres_data:
  caddy_data:
  firmware_data:
